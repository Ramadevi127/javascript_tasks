<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function addition()
        {
            var n1 =parseInt(document.getElementById("n1").value)
            var n2 =parseInt(document.getElementById("n2").value)
            var sum =n1+n2
             var sum =document.getElementById("n3").value=sum;
        }
         function subtration()
        {
            var n1 =parseInt(document.getElementById("n1").value)
            var n2 =parseInt(document.getElementById("n2").value)
            var sum =n1-n2
             var sum =document.getElementById("n3").value=sum;
        }
           function division()
        {
            var n1 =parseInt(document.getElementById("n1").value)
            var n2 =parseInt(document.getElementById("n2").value)
            var sum =n1/n2
             var sum =document.getElementById("n3").value=sum;
        }
         function multiply()
        {
            var n1 =parseInt(document.getElementById("n1").value)
            var n2 =parseInt(document.getElementById("n2").value)
            var sum =n1*n2
             var sum =document.getElementById("n3").value=sum;
        }
         function modules()
        {
            var n1 =parseInt(document.getElementById("n1").value)
            var n2 =parseInt(document.getElementById("n2").value)
            var sum =n1%n2
             var sum =document.getElementById("n3").value=sum;
        }
         function expo()
        {
            var n1 =parseInt(document.getElementById("n1").value)
            var n2 =parseInt(document.getElementById("n2").value)
            var sum =n1**n2
            var sum =document.getElementById("n3").value=sum;
        }
    </script>
    <style>
        *{
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
        }
        body{
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: rgb(82, 10, 99);
            background-color: rgb(194, 248, 248);
        }
        .container{
            height: 300px;
            width: 50%;
            border: 2px solid black;
            background-image: (skyblue);
            display: flex;
            justify-content:space-evenly;
            align-items: center;
            flex-direction: column;
        }
       
        .buttons {
           display: flex;
            flex-direction: row;
             gap: 10px;
}

button {
    width: 80px;
    height: 35px;
    border-radius: 10px;
    background-color: rgb(196, 225, 229);
}
    </style>
</head>
<body>
    <div class="container">

    <h1>Mini Calculator</h1>

    <label>Enter n1 :</label>
    <input type="text" id="n1" placeholder="Enter n1">

    <label>Enter n2 :</label>
    <input type="text" id="n2" placeholder="Enter n2">

    <label>Result</label>
    <input type="text" id="n3">

    <div class="buttons">
        <button onclick="addition()">Add</button>
        <button onclick="subtration()">Sub</button>
        <button onclick="division()">Div</button>
        <button onclick="multiply()">Mult</button>
        <button onclick="modules()">Mod</button>
        <button onclick="expo()">Expo</button>
    </div>

</div>
</body>
</html>
