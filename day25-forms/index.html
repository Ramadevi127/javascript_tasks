<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form

    </title>
</head>
<body>
    <h1>form example</h1>
    <form>

        
        <label >username:</label>
        <input type="text" placeholder="username"><br>
        <label>password:</label>
        <input type="password" placeholder="password"><br>
        <label>email:</label>
        <input type="email" placeholder="@email"><br>
        <label>DOB</label>
            <input type="date" placeholder="DOB"><br>
            <label>age</label>
            <input type="number" placeholder="age" min="10" max="15" >
    </form><br>
    <form>
        <h1>radio</h1>
        <label>select gender :</label>
        <input type="radio" name="gender" value="male" >male
        <input type="radio" name="gender" value="female">female
        <input type="radio" name="gender" value="other">other
    </form>
    <br>
    <h1>checkbox</h1>
    <form>
        <label>languages known:</label><br>
        <input type="checkbox" name="languages" value="telugu">telugu<br>
        <input type="checkbox" name="languages"  value="english">english<br>
        <input type="checkbox" name="languages" value="hindi">hindi
    </form>
    <br>
    <h1>dropdown</h1>
    <label>select city:</label>
    <select>
        <option value="rajam">rajam</option>
         <option>vizag</option>
          <option>srikakulam</option>
    </select>
     <h1>form example</h1>
     <br>
     <h1>fieldset</h1>
    <fieldset>
        <legend>personal info</legend>
        <label >username:</label>
        <input type="text" placeholder="username"><br>
        <label>password:</label>
        <input type="password" placeholder="password"><br>
        <label>email:</label>
        <input type="email" placeholder="@email"><br>
        <label>DOB</label>
            <input type="date" placeholder="DOB"><br>
            </fieldset>
            <fieldset>
                <legend>address</legend>
            <label>age</label>
            <input type="number" placeholder="age" min="10" max="15" >
            <label>address</label>
            <input type="textarea">
            </fieldset>
            <br>
            <h1>submit</h1>
            <form action="succes.html">
                <label>username:</label>
                <input type="text" placeholder="name" required><br>
                <label>email</label>
                <input type="email" placeholder="email" required><br>

                <input type="submit" value="login">
                <input type="reset" value="resetform">
            </form>
    </form><br>
</body>

</html>
